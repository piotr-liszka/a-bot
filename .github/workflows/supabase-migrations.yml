# Applies supabase/migrations to the hosted a-bot backend on every push to main,
# so the database never lags behind the app and agent.
# One-time setup (repo Settings → Secrets and variables → Actions):
#   secret SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   secret SUPABASE_DB_PASSWORD   database password of the project
#   variable SUPABASE_PROJECT_REF project ref (defaults to the hosted a-bot project)
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency: supabase-migrations

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'gaxtswumxpucmfoywcmq' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without credentials (forks)
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ok == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.creds.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
