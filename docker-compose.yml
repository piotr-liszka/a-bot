# Runs the a-bot shared box on this machine.
#   cp .env.example .env   # fill in backend URL and key
#   docker compose up -d
#   docker compose logs -f   # shows the pairing code on first start
services:
  a-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: a-bot-box:latest
    container_name: a-bot
    hostname: ${A_BOT_DEVICE_NAME:-a-bot}
    restart: unless-stopped
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${A_BOT_WORKSPACE_DIR:-./workspace}:/workspace
      - a-bot-home:/root
    shm_size: 1gb
    init: false

volumes:
  a-bot-home:
