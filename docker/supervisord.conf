; Desktop (Xvnc + openbox + noVNC websocket) and the a-bot agent.
; Only the agent logs to the container's stdout, so `docker logs a-bot` stays readable.

[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry 1440x900 -depth 24 -rfbport 5901 -localhost=1 -rfbauth /root/.vnc/passwd -AlwaysShared -AcceptSetDesktopSize=1
priority=10
autorestart=true
stdout_logfile=/var/log/a-bot-xvnc.log
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox-session
environment=DISPLAY=":1"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/var/log/a-bot-openbox.log
redirect_stderr=true

[program:websockify]
command=/usr/bin/websockify 0.0.0.0:6080 127.0.0.1:5901
priority=30
autorestart=true
stdout_logfile=/var/log/a-bot-websockify.log
redirect_stderr=true

[program:agent]
command=/usr/local/bin/a-bot-agent run
directory=/workspace
priority=40
autorestart=true
startretries=1000
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
